name: Build Release APK (Auto-Detect Signing)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  detect:
    name: Detect Project + Signing Configuration
    runs-on: ubuntu-latest
    outputs:
      gradle_dir: ${{ steps.detect.outputs.gradle_dir }}
      app_module: ${{ steps.detect.outputs.app_module }}
      gradle_task: ${{ steps.detect.outputs.gradle_task }}
      compile_sdk: ${{ steps.detect.outputs.compile_sdk }}
      jdk_version: ${{ steps.detect.outputs.jdk_version }}
      gradle_version: ${{ steps.detect.outputs.gradle_version }}
      wrapper_valid: ${{ steps.detect.outputs.wrapper_valid }}
      keystore_filename: ${{ steps.detect.outputs.keystore_filename }}
      uses_keystore_path_env: ${{ steps.detect.outputs.uses_keystore_path_env }}
      store_password_var: ${{ steps.detect.outputs.store_password_var }}
      key_alias_var: ${{ steps.detect.outputs.key_alias_var }}
      key_password_var: ${{ steps.detect.outputs.key_password_var }}
      signing_src: ${{ steps.detect.outputs.signing_src }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Detect Everything
      id: detect
      run: |
        set +e
        echo "===== Scanning project structure ====="

        GRADLEW_PATH=$(find . -maxdepth 6 -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
        GRADLE_DIR=$( [ -n "$GRADLEW_PATH" ] && dirname "$GRADLEW_PATH" || echo "." )
        echo "Gradle project directory: $GRADLE_DIR"

        WRAPPER_JAR="$GRADLE_DIR/gradle/wrapper/gradle-wrapper.jar"
        WRAPPER_VALID="true"
        if [ -f "$WRAPPER_JAR" ]; then
          unzip -tq "$WRAPPER_JAR" > /dev/null 2>&1 || WRAPPER_VALID="false"
        else
          WRAPPER_VALID="false"
        fi
        echo "Wrapper jar valid: $WRAPPER_VALID"

        APP_BUILD_FILE=$(grep -lRE "applicationId" --include="build.gradle*" "$GRADLE_DIR" 2>/dev/null | head -1)
        if [ -n "$APP_BUILD_FILE" ]; then
          MODULE_DIR=$(dirname "${APP_BUILD_FILE#$GRADLE_DIR/}")
          MODULE_PATH=$(echo "$MODULE_DIR" | sed 's|^\./||; s|/|:|g')
          APP_MODULE=":$MODULE_PATH"
          GRADLE_TASK="${APP_MODULE}:assembleRelease"
        else
          APP_MODULE=""
          GRADLE_TASK="assembleRelease"
        fi
        echo "Found build file: ${APP_BUILD_FILE:-none}"
        echo "App module: ${APP_MODULE:-none, using root fallback}"

        COMPILE_SDK=""
        if [ -n "$APP_BUILD_FILE" ]; then
          COMPILE_SDK=$(grep -oE 'compileSdk(Version)?[= ]+["'"'"']?[0-9]+' "$APP_BUILD_FILE" 2>/dev/null | grep -oE '[0-9]+' | head -1)
        fi
        if [ -z "$COMPILE_SDK" ]; then
          COMPILE_SDK=$(grep -rhoE 'compileSdk(Version)?[= ]+["'"'"']?[0-9]+' --include="build.gradle*" "$GRADLE_DIR" 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1)
        fi
        echo "compileSdk: ${COMPILE_SDK:-not found}"

        GRADLE_VERSION=""
        if [ "$WRAPPER_VALID" = "true" ] && [ -f "$GRADLE_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
          GRADLE_VERSION=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$GRADLE_DIR/gradle/wrapper/gradle-wrapper.properties" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
        fi
        echo "Pinned Gradle version: ${GRADLE_VERSION:-none, will use latest}"

        SIGNING_SRC="$APP_BUILD_FILE"
        [ -z "$SIGNING_SRC" ] && SIGNING_SRC=$(find "$GRADLE_DIR" -maxdepth 4 -name "build.gradle*" 2>/dev/null | head -1)

        KEYSTORE_FILENAME=$(grep -oE 'storeFile[^"'"'"']*["'"'"']([A-Za-z0-9_./-]+\.(jks|keystore))["'"'"']' "$SIGNING_SRC" 2>/dev/null \
          | grep -oE '[A-Za-z0-9_./-]+\.(jks|keystore)' | head -1)
        [ -z "$KEYSTORE_FILENAME" ] && KEYSTORE_FILENAME="my-upload-key.jks"
        echo "Detected keystore filename: $KEYSTORE_FILENAME"

        USES_KEYSTORE_PATH_ENV="false"
        grep -qE 'storeFile.*System\.getenv\(["'"'"']KEYSTORE_PATH["'"'"']\)' "$SIGNING_SRC" 2>/dev/null && USES_KEYSTORE_PATH_ENV="true"
        echo "Uses KEYSTORE_PATH env var: $USES_KEYSTORE_PATH_ENV"

        ALL_VARS=$(grep -oE 'System\.getenv\(["'"'"'][A-Z_]+["'"'"']\)' "$SIGNING_SRC" 2>/dev/null | grep -oE '[A-Z_]+')
        STORE_PASSWORD_VAR=$(echo "$ALL_VARS" | grep -iE 'store.*pass' | head -1)
        KEY_PASSWORD_VAR=$(echo "$ALL_VARS" | grep -iE 'key.*pass' | grep -viE 'store' | head -1)
        KEY_ALIAS_VAR=$(echo "$ALL_VARS" | grep -iE 'alias' | head -1)

        [ -z "$STORE_PASSWORD_VAR" ] && STORE_PASSWORD_VAR="STORE_PASSWORD"
        [ -z "$KEY_PASSWORD_VAR" ] && KEY_PASSWORD_VAR="KEY_PASSWORD"

        echo "Store password env var: $STORE_PASSWORD_VAR"
        echo "Key password env var: $KEY_PASSWORD_VAR"
        echo "Key alias env var: ${KEY_ALIAS_VAR:-none, likely hardcoded in build.gradle}"
        echo "===== Detection complete ====="

        {
          echo "gradle_dir=$GRADLE_DIR"
          echo "app_module=$APP_MODULE"
          echo "gradle_task=$GRADLE_TASK"
          echo "compile_sdk=$COMPILE_SDK"
          echo "jdk_version=17"
          echo "gradle_version=$GRADLE_VERSION"
          echo "wrapper_valid=$WRAPPER_VALID"
          echo "keystore_filename=$KEYSTORE_FILENAME"
          echo "uses_keystore_path_env=$USES_KEYSTORE_PATH_ENV"
          echo "store_password_var=$STORE_PASSWORD_VAR"
          echo "key_alias_var=$KEY_ALIAS_VAR"
          echo "key_password_var=$KEY_PASSWORD_VAR"
          echo "signing_src=$SIGNING_SRC"
        } >> "$GITHUB_OUTPUT"

    - name: Write Detection Summary
      run: |
        {
          echo "### 🔍 Detected Configuration"
          echo "| Setting | Value |"
          echo "|---|---|"
          echo "| Gradle dir | \`${{ steps.detect.outputs.gradle_dir }}\` |"
          echo "| App module | \`${{ steps.detect.outputs.app_module || 'root fallback' }}\` |"
          echo "| compileSdk | \`${{ steps.detect.outputs.compile_sdk || 'unknown' }}\` |"
          echo "| Wrapper valid | \`${{ steps.detect.outputs.wrapper_valid }}\` |"
          echo "| Keystore filename expected | \`${{ steps.detect.outputs.keystore_filename }}\` |"
          echo "| Store password env var | \`${{ steps.detect.outputs.store_password_var }}\` |"
          echo "| Key alias env var | \`${{ steps.detect.outputs.key_alias_var || 'none - hardcoded, alias auto-read from keystore instead' }}\` |"
          echo "| Key password env var | \`${{ steps.detect.outputs.key_password_var }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: detect
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    # Force-overwrites the signingConfigs block in the actual build file with
    # the known-good version, regardless of what AI Studio (or anything else)
    # changed it to. Inserts one if missing entirely. This runs BEFORE the
    # build, so a corrupted signingConfigs block never reaches Gradle.
    - name: Enforce Canonical Signing Config
      env:
        SIGNING_SRC: ${{ needs.detect.outputs.signing_src }}
        STORE_PASS_VAR: ${{ needs.detect.outputs.store_password_var }}
        KEY_PASS_VAR: ${{ needs.detect.outputs.key_password_var }}
      run: echo "" | base64 -d | python3

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ needs.detect.outputs.jdk_version }}
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Ensure Valid Gradle Wrapper
      working-directory: ${{ needs.detect.outputs.gradle_dir }}
      run: |
        if [ "${{ needs.detect.outputs.wrapper_valid }}" = "false" ]; then
          rm -rf gradle/wrapper
          if [ -n "${{ needs.detect.outputs.gradle_version }}" ]; then
            gradle wrapper --gradle-version "${{ needs.detect.outputs.gradle_version }}"
          else
            gradle wrapper
          fi
        fi
        chmod +x gradlew

    - name: Install Detected Android SDK Platform
      if: needs.detect.outputs.compile_sdk != ''
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-${{ needs.detect.outputs.compile_sdk }}" "build-tools;35.0.0" || true

    - name: Decode Keystore and Auto-Detect Alias
      working-directory: ${{ needs.detect.outputs.gradle_dir }}
      run: |
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set."
          exit 1
        fi
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ needs.detect.outputs.keystore_filename }}"
        echo "Keystore written as ${{ needs.detect.outputs.keystore_filename }} (runner-local only)"

        DETECTED_ALIAS=$(keytool -list -keystore "${{ needs.detect.outputs.keystore_filename }}" \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null \
          | grep "PrivateKeyEntry" | head -1 | cut -d, -f1)

        if [ -z "$DETECTED_ALIAS" ]; then
          echo "::error::Could not read any alias from the keystore. Check that KEYSTORE_PASSWORD is correct."
          exit 1
        fi
        echo "Auto-detected key alias: $DETECTED_ALIAS"
        echo "DETECTED_KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"

    - name: Build with Gradle
      working-directory: ${{ needs.detect.outputs.gradle_dir }}
      run: |
        export "${{ needs.detect.outputs.store_password_var }}"="${{ secrets.KEYSTORE_PASSWORD }}"
        export "${{ needs.detect.outputs.key_password_var }}"="${{ secrets.KEY_PASSWORD }}"
        # Always export as KEY_ALIAS - the "Enforce Canonical Signing Config"
        # step guarantees the build file reads exactly this name, regardless
        # of what detection saw in the file BEFORE that step ran.
        export KEY_ALIAS="$DETECTED_KEY_ALIAS"
        if [ "${{ needs.detect.outputs.uses_keystore_path_env }}" = "true" ]; then
          export KEYSTORE_PATH="$(pwd)/${{ needs.detect.outputs.keystore_filename }}"
        fi
        ./gradlew ${{ needs.detect.outputs.gradle_task }} --stacktrace --info

    - name: Wipe Keystore from Runner
      if: always()
      working-directory: ${{ needs.detect.outputs.gradle_dir }}
      run: rm -f "${{ needs.detect.outputs.keystore_filename }}"

    - name: Set Release Info
      run: |
        echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
        echo "RELEASE_TAG=v${{ github.run_number }}" >> $GITHUB_ENV

    - name: Locate APK
      run: |
        mkdir -p build-artifacts
        FOUND=$(find . -path "*/build/outputs/apk/release/*.apk" -not -path "*/build-artifacts/*")
        if [ -z "$FOUND" ]; then
          echo "No signed release APK found. Check the 'Build with Gradle' log above."
          exit 1
        fi
        echo "$FOUND" | while read -r apk; do cp "$apk" "./build-artifacts/"; done

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-${{ env.RELEASE_TAG }}-APK
        path: build-artifacts/*.apk
        if-no-files-found: error

    # Real, unique tag every run (v1, v2, v3...) instead of a static "latest"
    # tag - this is what lets release history actually accumulate instead of
    # each run silently overwriting the same single release.
    - name: Create Release
      if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/devel' || github.event_name == 'workflow_dispatch' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "My App ${{ env.RELEASE_TAG }}"
        body: |
          ### 🚀 What's Changed:
          ${{ github.event.head_commit.message || 'Manual triggering / Maintenance updates' }}

          ### 📅 Build Details:
          - **Build Time:** ${{ env.BUILD_TIME }}
          - **Triggered By:** @${{ github.actor }}
          - **Commit SHA:** ${{ github.sha }}
        draft: false
        prerelease: false
        files: build-artifacts/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Rolling "latest" release: always the same stable tag/URL, always the
    # newest APK, and its description lists every past build (version, date,
    # commit message, download link) - a single known place to check history,
    # no GitHub Pages required, works on private repos.
    - name: Build Release History
      if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/devel' || github.event_name == 'workflow_dispatch' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APP_NAME: "My App"
      run: echo "" | base64 -d | python3

    - name: Update Rolling "latest" Release
      if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/devel' || github.event_name == 'workflow_dispatch' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "My App — Latest Build"
        body_path: latest_body.md
        draft: false
        prerelease: false
        files: build-artifacts/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-failure-log:
    name: Publish Failure Log
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: failure()
    permissions:
      contents: write
      actions: read
    steps:
    - name: Fetch All Job Logs and Publish to ci-logs Branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: echo "" | base64 -d | python3
